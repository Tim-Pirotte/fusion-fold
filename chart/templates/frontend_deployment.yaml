apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.deployment.image }}"
          imagePullPolicy: {{ .Values.frontend.deployment.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.deployment.containerPort }}

          envFrom:
            - configMapRef:
                name: config-frontend

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
