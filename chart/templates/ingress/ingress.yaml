apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-router
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: traefik
  rules:
  - host: localhost
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: svc-frontend
              port:
                number: {{ .Values.frontend.service.port }}

        - path: /api
          pathType: Prefix
          backend:
            service:
              name: svc-api
              port:
                number: {{ .Values.api.service.port }}
