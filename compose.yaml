services:
  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    networks:
      - redis
    ports:
      - 8000:8000

  redis:
    build: ./redis
    restart: always
    networks:
      - redis
    secrets:
      - redis_acl

networks:
  redis:

secrets:
  redis_acl:
    file: ./redis/users.acl
