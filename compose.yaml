services:
  api:
    build: ./api
    env_file:
      - ./api/.env
    networks:
      - redis
      - postgres
    ports:
      - 5000:5000
    secrets:
      - serializer_secret
      - jwt_secret
      - redis_write
      - redis_read_delete
      - postgres_app_default
      - postgres_accounts_s
      - postgres_accounts_su
      - postgres_accounts_siu
      - postgres_accounts_sd

  frontend:
    build: ./frontend
    ports:
      - 8000:8000

  redis:
    build: ./redis
    restart: always
    networks:
      - redis
    secrets:
      - redis_acl

  postgres:
    build: ./postgres
    env_file:
      - ./postgres/.env
    networks:
      - postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    secrets:
      - pg_admin

networks:
  redis:
  postgres:

volumes:
  postgres-data:

secrets:
  serializer_secret:
    file: ./api/serializer.secret

  jwt_secret:
    file: ./api/jwt.secret

  redis_acl:
    file: ./redis/users.acl
  redis_write:
    file: ./redis/write.secret
  redis_read_delete:
    file: ./redis/read_delete.secret

  pg_admin:
    file: ./postgres/admin.secret
  postgres_app_default:
    file: ./postgres/app_default.secret
  postgres_accounts_s:
    file: ./postgres/accounts_s.secret
  postgres_accounts_su:
    file: ./postgres/accounts_su.secret
  postgres_accounts_siu:
    file: ./postgres/accounts_siu.secret
  postgres_accounts_sd:
    file: ./postgres/accounts_sd.secret
